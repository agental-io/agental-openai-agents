[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agental-openai-agents"
version = "0.1.3"
description = "agental.io sandboxes for the OpenAI Agents SDK: run a SandboxAgent in a Linux machine of your own. Not made by OpenAI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VERTIXER LTD" }]
requires-python = ">=3.10"
# Each release is tested with the Agents SDK versions it allows: its sandbox interface changes often.
dependencies = ["agental-sdk>=0.1.0,<0.5", "openai-agents>=0.24.0,<0.25"]
keywords = ["agental", "openai", "agents", "sandbox", "openai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://agental.io/docs/openai-agents"
Documentation = "https://agental.io/docs/openai-agents"
Source = "https://github.com/agental-io/agental-openai-agents"
Issues = "https://github.com/agental-io/agental-openai-agents/issues"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/agental_openai_agents"]

# The live tests start the API from the agental repository and are kept there: they are in
# neither the sdist nor the public repository.
[tool.hatch.build.targets.sdist]
exclude = ["tests/test_live.py", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]
